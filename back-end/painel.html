<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>GScan - Painel de Testes</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 1.4rem; }
  p.hint { color: #666; font-size: 0.9rem; }
  label { display: block; margin-top: 14px; font-weight: 600; font-size: 0.9rem; }
  select, input[type=text], input[type=file] { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; font-size: 0.95rem; }
  button { margin-top: 18px; padding: 10px 20px; font-size: 0.95rem; cursor: pointer; }
  #resultado { margin-top: 20px; padding: 12px; background: #f5f5f5; border-radius: 6px; white-space: pre-wrap; word-break: break-word; font-family: monospace; font-size: 0.85rem; min-height: 40px; }
  #status { margin-top: 10px; font-size: 0.9rem; }
  .erro { color: #b00020; }
  .ok { color: #146c2e; }
</style>
</head>
<body>

<h1>GScan - Painel de Testes</h1>
<p class="hint">Ferramenta local para chamar os endpoints diretamente, sem precisar do front-end. Cada API deve estar rodando na sua porta (veja o README).</p>

<label for="endpoint">Endpoint</label>
<select id="endpoint"></select>

<label for="arquivo">Arquivo</label>
<input type="file" id="arquivo" accept=".pdf,.jpg,.jpeg,.png">

<div id="campos-extra"></div>

<button id="enviar">Enviar</button>

<div id="status"></div>
<div id="resultado"></div>

<script>
const ENDPOINTS = {
  transcribe: {
    label: "POST /transcribe (app.py - texto completo via Tesseract)",
    url: "http://127.0.0.1:8000/transcribe",
    campos: []
  },
  extract_fields: {
    label: "POST /extract_fields (appfield.py - campos específicos via PaddleOCR)",
    url: "http://127.0.0.1:8001/extract_fields",
    campos: [{ nome: "fields", rotulo: "Campos (separados por vírgula)", placeholder: "Nome,CPF" }]
  },
  extract: {
    label: "POST /extract (appall.py - chave:valor automático via PaddleOCR)",
    url: "http://127.0.0.1:8002/extract",
    campos: []
  },
  split: {
    label: "POST /split (appsplit.py - divide PDF em páginas)",
    url: "http://127.0.0.1:8003/split",
    campos: [{ nome: "paginas", rotulo: "Páginas (opcional, ex.: 1,3,5-7)", placeholder: "vazio = todas" }]
  }
};

const selectEndpoint = document.getElementById("endpoint");
const camposExtraDiv = document.getElementById("campos-extra");
const statusDiv = document.getElementById("status");
const resultadoDiv = document.getElementById("resultado");

for (const [chave, cfg] of Object.entries(ENDPOINTS)) {
  const opt = document.createElement("option");
  opt.value = chave;
  opt.textContent = cfg.label;
  selectEndpoint.appendChild(opt);
}

function renderCamposExtra() {
  const cfg = ENDPOINTS[selectEndpoint.value];
  camposExtraDiv.innerHTML = "";
  for (const campo of cfg.campos) {
    const label = document.createElement("label");
    label.textContent = campo.rotulo;
    const input = document.createElement("input");
    input.type = "text";
    input.id = `campo-${campo.nome}`;
    input.placeholder = campo.placeholder || "";
    camposExtraDiv.appendChild(label);
    camposExtraDiv.appendChild(input);
  }
}

selectEndpoint.addEventListener("change", renderCamposExtra);
renderCamposExtra();

document.getElementById("enviar").addEventListener("click", async () => {
  const cfg = ENDPOINTS[selectEndpoint.value];
  const arquivoInput = document.getElementById("arquivo");

  if (!arquivoInput.files.length) {
    statusDiv.innerHTML = '<span class="erro">Selecione um arquivo primeiro.</span>';
    return;
  }

  const formData = new FormData();
  formData.append("file", arquivoInput.files[0]);
  for (const campo of cfg.campos) {
    const valor = document.getElementById(`campo-${campo.nome}`).value;
    formData.append(campo.nome, valor);
  }

  statusDiv.textContent = "Enviando...";
  resultadoDiv.textContent = "";

  try {
    const resposta = await fetch(cfg.url, { method: "POST", body: formData });
    const contentType = resposta.headers.get("content-type") || "";

    if (contentType.includes("application/json")) {
      const dados = await resposta.json();
      resultadoDiv.textContent = JSON.stringify(dados, null, 2);
      statusDiv.innerHTML = dados.error
        ? '<span class="erro">A API retornou um erro.</span>'
        : `<span class="ok">OK (HTTP ${resposta.status})</span>`;
    } else {
      // resposta binária (ex.: .zip do /split) -> baixa o arquivo
      const blob = await resposta.blob();
      const disposicao = resposta.headers.get("content-disposition") || "";
      const match = disposicao.match(/filename="?([^"]+)"?/);
      const nomeArquivo = match ? match[1] : "download";

      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = nomeArquivo;
      a.click();
      URL.revokeObjectURL(url);

      statusDiv.innerHTML = `<span class="ok">Arquivo baixado: ${nomeArquivo}</span>`;
      resultadoDiv.textContent = `(resposta binária, ${blob.size} bytes)`;
    }
  } catch (erro) {
    statusDiv.innerHTML = `<span class="erro">Falha ao chamar ${cfg.url} — a API está rodando nessa porta?</span>`;
    resultadoDiv.textContent = String(erro);
  }
});
</script>

</body>
</html>
